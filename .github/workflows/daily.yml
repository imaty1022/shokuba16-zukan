name: daily-post
on:
  schedule:
    - cron: "31 11 * * *"   # 毎日 20:31 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - run: python -m bot.talk_generate
      - run: python -m bot.talk_render
      - name: 画像を公開(InstagramがURLから取得するため)
        run: |
          git config user.name "bot" && git config user.email "bot@users.noreply.github.com"
          git add posts data/today.json && git commit -m "post: $(date +%F)" && git push
          sleep 20
      - run: python -m bot.publish
      - name: 履歴を保存
        run: git add data/history.json && git commit -m "history: $(date +%F)" && git push
