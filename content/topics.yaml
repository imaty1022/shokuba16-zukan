# 「いる、こういう人。」のネタ帳。1日1つ消化する。足りなくなったら行を足すだけ。
# 選ぶ基準: どの職場にもいる / 世間の正解が決まっていない / 本人にも周りにも言い分がある
# type は「このタイプに多いと言われる」主役。scene は生成のヒント(時刻・数字・場所を入れる)。
topics:
  働き方:
    - {type: ISTP, title: 定時ぴったりに帰る人, scene: 18時00分00秒に席を立つ。3分後に客先から急ぎの電話が来る}
    - {type: ESFP, title: 始業1分前に来る人, scene: 毎朝8時59分に着席。9時の朝会は座った瞬間に始まる}
    - {type: ISFJ, title: 先輩より先に帰れない人, scene: 仕事は17時半に終わっているのに、先輩が帰る20時まで席にいる}
    - {type: ISFP, title: イヤホンで仕事する人, scene: 両耳イヤホンで作業。3回呼んでも気づかず、肩をたたかれる}
    - {type: INTP, title: 締切の朝に作り直す人, scene: 締切当日の朝9時に「全部作り直します」と言い出す。提出は17時}
    - {type: ISTJ, title: 手順書どおりにしか動かない人, scene: 急ぎの依頼でも手順書の12工程を1つも飛ばさない。客先は30分待っている}
    - {type: INFJ, title: 頼まれると断れない人, scene: 17時50分に頼まれた資料を引き受けて22時まで残る。今月4回目}
    - {type: ESTP, title: 相談せず客先で即決する人, scene: 商談の場で値引き10%をその場で約束。上司は帰社後に知る}
    - {type: ENFP, title: 思いつきで企画を始める人, scene: 月曜の朝に新企画を宣言。先週始めた企画は3つとも止まっている}
    - {type: ISFP, title: 繁忙期に有給を取る人, scene: 決算の週に3連休を申請。申請は規定どおり2週間前に出している}
  会議:
    - {type: INTJ, title: 会議を「メールで済む」と断る人, scene: 60分の定例の招待を「要点はメールで」と辞退。出席者は8人}
    - {type: ENTJ, title: 5分で結論を決める人, scene: 60分の会議を開始5分で「じゃあA案で」と締める。発言できたのは2人}
    - {type: ENTP, title: 決まった案をひっくり返す人, scene: 先週全員で決めた案に、翌週月曜「やっぱり逆がいい」と言う}
    - {type: INFP, title: カメラOFFを貫く人, scene: オンライン会議で10人中1人だけカメラOFF。発言はチャットで的確}
    - {type: ESTJ, title: 毎朝の朝会をやめない人, scene: 毎朝9時から15分の朝会。報告は全員「特にありません」}
    - {type: ENTP, title: わざと反対意見を言う人, scene: 全員賛成の案に1人だけ反対を述べる。会議は30分延びる}
    - {type: INTP, title: 会議後に長文で反論する人, scene: 会議中は無言。終了10分後に800字の反論をチャットに投稿}
    - {type: ENFP, title: 雑談で会議を延ばす人, scene: 冒頭の雑談が20分。30分の会議が50分になる}
  連絡:
    - {type: ISTP, title: 既読だけで返信しない人, scene: 依頼チャットに既読だけ付ける。翌朝、頼んだ作業は終わっている}
    - {type: ESTJ, title: 全員をCCに入れる人, scene: 1人あての確認メールに部の23人をCCで入れる}
    - {type: ENTJ, title: 休日に連絡してくる人, scene: 日曜の21時に業務チャットを送る。「月曜でいいよ」と添えてある}
    - {type: INFP, title: 電話に出ずチャットで返す人, scene: 着信に出ず、1分後に「チャットでお願いします」と返す}
    - {type: INFJ, title: 言わずに日報に書く人, scene: 会議では賛成したのに、夜の日報に懸念を5行書く}
    - {type: ISTJ, title: 1分の遅刻も報告させる人, scene: 9時01分に着いた部下に遅刻届を出させる。規則にはそう書いてある}
    - {type: ESTP, title: 経費をまとめて出す人, scene: 3か月分の領収書47枚を締め日の17時に持ってくる}
    - {type: INTJ, title: 「了解」しか返さない人, scene: 10行の相談メールに「了解です」の4文字だけ返す}
  人づきあい:
    - {type: INTJ, title: 飲み会を毎回断る人, scene: 歓迎会も忘年会も不参加が5回連続。仕事の成績は部で1位}
    - {type: ESFJ, title: 毎日ランチに誘う人, scene: 毎日11時55分に「お昼どうする？」と声をかけて回る}
    - {type: ENFJ, title: 後輩の仕事を巻き取る人, scene: 後輩が詰まると30分で自分が仕上げる。後輩は半年同じ所で詰まる}
    - {type: ISFJ, title: お土産を全員に配る人, scene: 旅行のたびに部の23人全員にお土産。配らない人が目立つ}
    - {type: ESFJ, title: 送別会を必ず開く人, scene: 在籍3か月で辞める人にも会費5000円の送別会を企画する}
    - {type: ESFP, title: 仕事中にSNSを更新する人, scene: 14時に昼の写真を投稿。成果は出していて、取引先にもフォロワーが多い}
    - {type: ENFJ, title: 全員の誕生日を祝う人, scene: 毎月、部の全員から500円ずつ集めてケーキを買う}
    - {type: ISFP, title: 服装が自由すぎる人, scene: 規定のない職場に金髪とサンダルで出社。来客は週に1回ある}
