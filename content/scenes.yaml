# 投稿ネタの「瞬間」カタログ。1日1つ消化する。足りなくなったら行を足すだけ。
# 書き方のルール: 場所・時刻・数字・セリフのどれかを必ず入れ、「一瞬」を切り取る。
moments:
  採用面接:
    - 面接の最後に「何か質問はありますか？」と聞かれた瞬間
    - 面接で「あなたの短所を教えてください」と言われた時
    - 面接官として、応募者が30秒黙り込んでしまった時
    - オンライン面接で相手の音声が途切れた時
    - 面接で「5年後どうなっていたいですか？」と聞かれた時
    - 面接会場に20分早く着いてしまった時
  会議:
    - 会議で「他に意見ある人？」のあと10秒沈黙が続いた時
    - 終了予定を15分過ぎても会議が終わらない時
    - 自分の案が上司に目の前で却下された時
    - 「議事録、誰か取ってくれる？」と言われた瞬間
    - 結論が出ないまま「また次回話しましょう」になった時
    - オンライン会議で自分だけカメラONだった時
  デスクワーク:
    - 集中している時に「今ちょっといい？」と話しかけられた時
    - 17時55分に「今日中でお願い」と依頼が来た時
    - 月曜の朝、未読メールが100件たまっていた時
    - メールを送信した直後に誤字に気づいた時
    - 保存前にエクセルが落ちた瞬間
    - 昼休みまであと10分、キリの悪い作業が残っている時
    - 隣の席のタイピング音が異常に大きい時
  出張:
    - 新幹線で上司と隣の席になった2時間半
    - 出張先で商談が予定より2時間早く終わった時
    - ホテルに着いたら充電器を忘れていた時
    - 帰りの飛行機が90分遅延した時
    - 出張帰り、駅の売店でお土産を選ぶ時
    - 前泊の夜、取引先に「もう一軒どうですか」と誘われた時
  チャット・メール:
    - 上司から「ちょっと話せる？」とだけチャットが来た時
    - 全社チャンネルに誤爆してしまった時
    - 金曜18時に長文の相談メッセージが届いた時
    - 自分の投稿にリアクションが1つも付かない時
  1on1・評価:
    - 1on1で「最近どう？」と聞かれた時
    - 評価面談で想定より低い評価を告げられた時
    - 上司に「何かやりたいことある？」と聞かれた時
    - 後輩に同じ質問を3回された時
  締切・トラブル:
    - 納期前日に仕様変更を告げられた時
    - 自分のミスにまだ誰も気づいていないと分かった時
    - 引き継ぎ資料がA4一枚しかなかった時
    - プレゼン開始5分前にプロジェクターが映らない時
  オフィスの日常:
    - エレベーターで社長と2人きりになった時
    - 飲み会の幹事を誰がやるか決める空気になった時
    - 有給を申請する時の一言
    - リモートワークの日の午前10時
    - 定時で帰ろうとしたら周りが誰も席を立たない時
    - 新人の歓迎ランチで話すこと
    - 退職する同僚への寄せ書きに書くこと

# 「1タイプの1日」形式で使う舞台。16タイプ×舞台で回す。
timelines:
  - 日帰り出張の1日
  - 締切当日の1日
  - 採用面接を受ける日
  - 月曜日の1日
  - リモートワークの1日
  - 異動初日
